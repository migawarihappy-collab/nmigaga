<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ボタモン">
    <meta name="theme-color" content="#333333">
    
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <title>デジモントーク</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #222;
        }
        body {
            color: #fff;
            font-family: 'Courier New', Courier, monospace, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 95%;
            max-width: 450px;
            height: 95%;
            max-height: 700px;
            background: #333;
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            position: relative;
        }

        /* ネームエントリー画面 */
        .name-entry-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #222;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .name-entry-box {
            width: 90%;
            border: 4px double #fff;
            padding: 30px 10px;
            background: #111;
            text-align: center;
        }
        .name-entry-title {
            font-size: 18px;
            color: #ffcc00;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* API設定 */
        .api-setting {
            margin-bottom: 5px;
            font-size: 11px;
            color: #aaa;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .check-btn {
            background: #28a745;
            padding: 3px 8px;
            font-size: 10px;
        }
        select {
            background: #111;
            color: #fff;
            border: 2px solid #888;
            padding: 3px;
            border-radius: 4px;
            font-size: 12px;
        }
        .bg-selector-container {
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            padding: 0 4px;
        }
        .user-info-container {
            font-size: 12px;
            color: #fff;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .rename-btn, .status-btn {
            background: #555;
            padding: 2px 6px;
            font-size: 10px;
            border: 1px solid #aaa;
            border-radius: 3px;
            cursor: pointer;
            color: #fff;
        }
        .status-btn {
            background: #ff9900;
            color: #000;
            font-weight: bold;
            border-color: #ffcc00;
        }

        /* ステータスモーダル */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            width: 85%;
            background: #111;
            border: 4px double #ffcc00;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            font-family: 'DotGothic16', sans-serif;
            text-align: left;
            color: #fff;
            box-shadow: 0 0 10px #000;
        }
        .modal-title {
            font-size: 16px;
            color: #ffcc00;
            text-align: center;
            border-bottom: 2px dashed #555;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .status-label { color: #aaa; }
        .status-val { font-weight: bold; color: #fff; }

        .emotion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: #222;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            margin: 8px 0 12px 0;
        }
        .emotion-item {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .modal-close-btn {
            display: block;
            width: 100%;
            padding: 6px;
            background: #555;
            color: #fff;
            border: 1px solid #888;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-family: 'DotGothic16', sans-serif;
            margin-top: 10px;
        }

        /* お世話コマンドエリア */
        .care-panel {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 4px;
        }
        .care-btn {
            flex: 1;
            padding: 6px 2px;
            font-size: 10px;
            font-family: 'DotGothic16', sans-serif;
            background: #555;
            color: #fff;
            border: 2px solid #888;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.3;
            pointer-events: none;
            transition: opacity 0.3s, background 0.2s;
        }
        .care-btn.active {
            opacity: 1.0;
            pointer-events: auto;
            background: #007acc;
            animation: pulseBtn 1s infinite alternate;
        }
        @keyframes pulseBtn {
            0% { border-color: #fff; }
            100% { border-color: #ffcc00; }
        }

        /* 表示エリア */
        .digimon-box {
            flex-grow: 1;
            min-height: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            border: 2px inset #555;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            background: #444; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .digimon-img {
            max-height: 90px;
            object-fit: contain;
            position: absolute;
            bottom: 10px;
            animation: walkPattern 8s infinite ease-in-out;
            animation-delay: 0.1s;
            transition: max-height 0.3s ease;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .digimon-img.adult-size {
            max-height: 135px;
        }

        .action-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 10px;
            gap: 20px;
            background: rgba(0,0,0,0.1);
        }
        .action-digimon-img, .action-effect-img {
            max-height: 80px;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: max-height 0.3s ease;
        }

        .action-digimon-img.adult-size {
            max-height: 120px;
        }

        @keyframes walkPattern {
            0% { transform: translateX(0) scaleX(1); }
            12.5% { transform: translateX(60px) scaleX(1); }
            25% { transform: translateX(60px) scaleX(1); }
            25.01% { transform: translateX(60px) scaleX(-1); }
            37.5% { transform: translateX(0) scaleX(-1); }
            50% { transform: translateX(0) scaleX(-1); }
            62.5% { transform: translateX(-60px) scaleX(-1); }
            75% { transform: translateX(-60px) scaleX(-1); }
            75.01% { transform: translateX(-60px) scaleX(1); }
            87.5% { transform: translateX(0) scaleX(1); }
            100% { transform: translateX(0) scaleX(1); }
        }

        .dialogue-box {
            background: #000;
            border: 2px solid #888;
            padding: 8px 10px;
            min-height: 70px;
            text-align: left;
            margin-bottom: 8px;
            line-height: 1.4;
            font-size: 14px; 
            font-family: 'DotGothic16', sans-serif;
        }
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="password"] {
            padding: 8px;
            border: 2px solid #888;
            background: #111;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="text"] {
            flex-grow: 1;
        }
        button {
            padding: 8px 12px;
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #errorLog, #modelListLog {
            position: absolute;
            bottom: 10px;
            left: 5%;
            width: 90%;
            padding: 10px;
            border-radius: 4px;
            font-size: 10px;
            text-align: left;
            display: none;
            word-break: break-all;
            white-space: pre-wrap;
            box-sizing: border-box;
            z-index: 110;
        }
        #errorLog { background: #400; color: #ff9999; }
        #modelListLog { background: #1e3a1e; color: #99ff99; }
    </style>
</head>
<body>

<div class="container">
    <!-- ネームエントリー画面 -->
    <div id="nameEntryScreen" class="name-entry-screen" style="display: none;">
        <div class="name-entry-box">
            <div class="name-entry-title">アナタノ ナマエ オシエテ！</div>
            <div class="input-box" style="justify-content: center;">
                <input type="text" id="nameInput" placeholder="アナタの名前" style="text-align: center; max-width: 200px;" onkeypress="if(event.key === 'Enter') saveName()">
                <button onclick="saveName()">OK</button>
            </div>
        </div>
    </div>

    <!-- ステータスモーダル画面 -->
    <div id="statusModal" class="modal-overlay" style="display: none;" onclick="closeStatusModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title">📊 デジモンステータス</div>
            <div class="status-row">
                <span class="status-label">【 なまえ 】</span>
                <span class="status-val" id="statName">ボタモン</span>
            </div>
            <div class="status-row">
                <span class="status-label">【 せいかく 】</span>
                <span class="status-val" id="statPersonality" style="color: #ffcc00;">素直</span>
            </div>
            <div class="status-row">
                <span class="status-label">【 へんかまで 】</span>
                <span class="status-val" id="statEvolutionCount" style="color: #00ffcc;">0 / 10</span>
            </div>

            <div style="font-size: 11px; color: #aaa; margin-top: 10px; margin-bottom: 4px;">【 かんじょうち 】</div>
            <div class="emotion-grid">
                <div class="emotion-item">
                    <span style="color: #aaa;">信頼:</span>
                    <span id="statNormal" style="color: #fff;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #ff66aa;">歓喜:</span>
                    <span id="statHappy" style="color: #ff66aa;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #ff4444;">激情:</span>
                    <span id="statAngry" style="color: #ff4444;">0</span>
                </div>
                <div class="emotion-item">
                    <span style="color: #aa66ff;">感受:</span>
                    <span id="statSad" style="color: #aa66ff;">0</span>
                </div>
            </div>

            <button class="modal-close-btn" onclick="toggleStatusModal(false)">とじる</button>
        </div>
    </div>

    <!-- APIキー設定 -->
    <div class="api-setting">
        <div>
            <label for="apiKey">Gemini API Key: </label>
            <input type="password" id="apiKey" placeholder="AIZA..." style="padding: 2px; font-size: 10px; width: 150px;" onchange="saveApiKey()">
        </div>
        <div>
            <button class="check-btn" onclick="checkAvailableModels()">👉 キーで使えるモデルを調べる</button>
        </div>
        <div id="modelSelectContainer" style="display: none;">
            <select id="modelSelect"></select>
        </div>
    </div>

    <!-- 設定・情報エリア -->
    <div class="bg-selector-container">
        <div>
            <label for="bgSelect">背景🏕️: </label>
            <select id="bgSelect" onchange="changeBackground()">
                <option value="">なし</option>
                <option value="mati.jpg">はじまりの町</option>
                <option value="sima.jpg">ファイル島</option>
                <option value="senro.jpg">電車の平原</option>
                <option value="mori.jpg">森林</option>
                <option value="yugure.jpg">夕暮れ</option>
                <option value="den.jpg">サイバー空間</option>
                <option value="den2.jpg">サイバー空間２</option>
            </select>
        </div>
        <div class="user-info-container">
            <span>👤:<span id="userNameDisplay">---</span></span>
            <button class="rename-btn" onclick="showNameEntry()">かえる</button>
            <button class="status-btn" onclick="toggleStatusModal(true)">📊 ステータス</button>
        </div>
    </div>

    <!-- お世話コマンドパネル -->
    <div class="care-panel">
        <button id="careMeal" class="care-btn" onclick="executeCare('happy', 5, 'eat_animation.gif', 'ごはんをもらって<span style=&quot;color: #ff66aa; font-weight: bold;&quot;>【歓喜】</span>の感情値が上がった！')">🍙 エサ</button>
        <button id="careTrain" class="care-btn" onclick="executeCare('normal', 5, 'Training_animation.gif', 'トレーニングを頑張って<span style=&quot;color: #00ccff; font-weight: bold;&quot;>【信頼】</span>の感情値が上がった！')">💪 トレーニング </button>
        <button id="careDefense" class="care-btn" onclick="executeCare('angry', 5, 'battle_animation.gif', 'ネットワークウィルスを撃退して<span style=&quot;color: #ff4444; font-weight: bold;&quot;>【激情】</span>の感情値が上がった！')">🛡️ ウイルス退治</button>
        <button id="careData" class="care-btn" onclick="executeCare('sad', 5, 'deta_animation.gif', 'ネットワークデータ収集をして<span style=&quot;color: #aa66ff; font-weight: bold;&quot;>【感受】</span>の感情値が上がった！')">💻 収集</button>
    </div>

    <!-- デジモン表示エリア -->
    <div class="digimon-box" id="digimonBox">
        <img id="digimonImage" src="normal.gif" alt="normal" class="digimon-img" loading="eager">

        <div id="actionContainer" class="action-container" style="display: none;">
            <img id="actionDigimonImg" class="action-digimon-img" src="" alt="digimon">
            <img id="actionEffectImg" class="action-effect-img" src="" alt="action">
        </div>
    </div>

    <!-- セリフ窓 -->
    <div class="dialogue-box">
        <div style="font-size: 11px; color: #ffcc00; margin-bottom: 3px;">
            <span id="digimonName">ボタモン</span>
            <span id="personalityDisplay" style="font-size: 10px; color: #aaa; margin-left: 5px;"></span>
            <span id="careCounterDisplay" style="font-size: 10px; color: #00ffcc; float: right;">お世話まであと: 0/5</span>
        </div>
        <div id="dialogueText"></div>
    </div>

    <!-- 入力エリア -->
    <div class="input-box">
        <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">送信</button>
    </div>

    <div id="modelListLog"></div>
    <div id="errorLog"></div>
</div>

<script>
    // --- Service Workerの登録 (PWA用) ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker 登録成功:', reg.scope))
                .catch(err => console.log('Service Worker 登録失敗:', err));
        });
    }

    // --- 状態変数 ---
    let talkCount = 0;          
    let careCount = 0;          
    let isPerformingAction = false; 
    let currentForm = 'botamon'; 
    let currentPersonalityKey = '';
    let emotionCounts = {
        happy: 0,
        angry: 0,
        sad: 0,
        normal: 0
    };

    // 成熟期のリスト定義
    const ADULT_DIGIMONS = [
        'greymon', 'giogreymon', 'dalktiranomon',
        'tiranomon', 'monokuromon', 'yukidarumon'
    ];

    // 完全体リストの定義 
    const PERFECT_DIGIMONS = [
        'mamemon', 'mastertiranomon', 'metaltiranomon', 
        'metalgreymon', 'raisgreymon', 'vamirimon'
    ];

    // 究極体リストの定義
    const ULTIMATE_DIGIMONS = [
        'wogureymon', 'vgureymon', 'silyaingreymon',
        'bwogureymon', 'mugendoramon', 'rasttiranomon'
    ];

    // 表示名のマップ
    const DIGIMON_NAMES = {
        botamon: "ボタモン",
        koromon: "コロモン",
        agumon: "アグモン",
        agumon2006: "アグモン2006",
        agumon_black: "アグモン（黒）",
        yuki_agumon: "ユキアグモン",
        greymon: "グレイモン",
        giogreymon: "ジオグレイモン",
        dalktiranomon: "ダークティラモン",
        tiranomon: "ティラモン",
        monokuromon: "モノクロモン",
        yukidarumon: "ユキダルモン",
        mamemon: "マメモン",
        mastertiranomon: "マスターティラノモン",
        metaltiranomon: "メタルティラノモン",
        metalgreymon: "メタルグレイモン",
        raisgreymon: "ライズグレイモン",
        vamirimon: "ヴァーミリモン",
        wogureymon: "ウォーグレイモン",
        vgureymon: "ビクトリーグレイモン",
        silyaingreymon: "シャイングレイモン",
        bwogureymon: "ブラックウォーグレイモン",
        mugendoramon: "ムゲンドラモン",
        rasttiranomon: "ラストティラノモン"
    };

    const DIGIMON_DETAILS = {
        botamon: "生まれたての全身が黒い繊毛で覆われた、黄色い目を持つ生まれたてのデジモンです。まだ生まれたてです。",
        koromon: "ボタモンから進化した、ピンク色の体に長い耳のような触角を持つ丸っこい幼年期Ⅱのデジモンです。",
        agumon: "コロモンから進化した黄色い恐竜の子供みたいな成長期のデジモンです。必殺技は口から火炎玉を吐き出す”ベビーフレイム”です。",
        agumon2006: "コロモンから進化した黄色い恐竜の子供みたいな姿に赤いレザーバンドを手に巻けた成長期のデジモンです。必殺技は強力な火炎玉を吐き出す”ベビーバーナー”です。",
        agumon_black: "コロモンから進化した黒い恐竜の子供みたいな成長期のデジモンです。必殺技は口から連続火炎を吐き出す”スピットファイア”です。",
        yuki_agumon: "コロモンから進化した白い恐竜の子供みたいな成長期のデジモンです。必殺技は口から小さな吹雪を吐き出す”リトルブリザード”です。",
        greymon: "頭部を角の生えた殻で覆った巨大な恐竜みたいな成熟期のデジモンです。必殺技は口から超高熱火炎を吐き出す”メガフレイム”です。",
        giogreymon: "頭部を角の生えた殻で覆った巨大な恐竜みたいな成熟期のデジモンです。グレイモンの亜種で模様が濃く力が強い。必殺技は口から超高熱火炎を極限まで高め吐き出す”メガバースト”です。",
        dalktiranomon: "悪質なコンピュータウイルスに体を浸食された黒い恐竜みたいな成熟期のデジモンです。必殺技は超強力な火炎放射”ファイヤーブラスト”です。",
        tiranomon: "真っ赤な皮膚を持つ大昔の恐竜のような見た目をした成熟期のデジモンです。知能が高く穏やかな性格をしています。必殺技は鮮やかな赤色の火炎を吐き出す”ファイヤーブレス”です。",
        monokuromon: "サイの角を生やしたトリケラトプスのような草食性な成熟期のデジモンです。必殺技は強力な火炎弾”ヴォルケーノストライク”です。",
        yukidarumon: "全身が雪と氷でできた心優しい雪だるまの姿をした成熟期のデジモンです。必殺技は絶対零度の冷気パンチ”絶対零度パンチ”です。",
        mamemon: "グローブを付けた豆粒みたいな見た目でありながら強力な攻撃力を持つ突然変異型の完全体デジモンです。必殺技はパンチでグローブを爆発させる”スマイリーボム”です。",
        mastertiranomon: "多くの戦いを勝ち抜き激しい修行を重ねた恐竜型デジモンです。必殺技は超高熱の火炎球を発射する”マスターファイアー”です。",
        metaltiranomon: "対地用迎撃の為に体をサイボーグ化した恐竜の完全体デジモンです。必殺技は左腕から放つエネルギー砲”ヌークリアレーザー”です。",

    // --- ステータス表示モーダル ---
    function toggleStatusModal(show) {
        const modal = document.getElementById('statusModal');
        if (show) {
            updateStatusModalData();
            modal.style.display = 'flex';
        } else {
            modal.style.display = 'none';
        }
    }

    function closeStatusModal(event) {
        if (event.target.id === 'statusModal') {
            toggleStatusModal(false);
        }
    }

    function getNextEvolutionThreshold() {
        if (currentForm === 'botamon') return 10;
        if (currentForm === 'koromon') return 20;
        if (['agumon', 'agumon2006', 'agumon_black', 'yuki_agumon'].includes(currentForm)) return 30;
        if (ADULT_DIGIMONS.includes(currentForm)) return 40;
        if (PERFECT_DIGIMONS.includes(currentForm)) return 70;
        if (ULTIMATE_DIGIMONS.includes(currentForm)) return 80;
        return 0;
    }

    function updateStatusModalData() {
        document.getElementById('statName').innerText = DIGIMON_NAMES[currentForm] || "デジモン";
        
        const pInfo = PERSONALITIES[currentPersonalityKey];
        document.getElementById('statPersonality').innerText = pInfo ? pInfo.name : "不明";

        const threshold = getNextEvolutionThreshold();
        const labelText = ULTIMATE_DIGIMONS.includes(currentForm) ? "てんせいまで" : "しんかまで";
        document.querySelector('#statusModal .status-row:nth-child(4) .status-label').innerText = `【 ${labelText} 】`;
        document.getElementById('statEvolutionCount').innerText = `${talkCount} / ${threshold}`;

        document.getElementById('statNormal').innerText = emotionCounts.normal || 0;
        document.getElementById('statHappy').innerText = emotionCounts.happy || 0;
        document.getElementById('statAngry').innerText = emotionCounts.angry || 0;
        document.getElementById('statSad').innerText = emotionCounts.sad || 0;
    }

    // --- セーブ/ロード機能 ---
    function saveData() {
        const state = {
            currentForm: currentForm,
            currentPersonalityKey: currentPersonalityKey,
            talkCount: talkCount,
            careCount: careCount,
            emotionCounts: emotionCounts,
            bgValue: document.getElementById('bgSelect').value
        };
        localStorage.setItem('digimonState', JSON.stringify(state));
    }

    function loadData() {
        const savedApiKey = localStorage.getItem('geminiApiKey');
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
        }

        const savedState = localStorage.getItem('digimonState');
        if (savedState) {
            try {
                const state = JSON.parse(savedState);
                currentForm = state.currentForm || 'botamon';
                currentPersonalityKey = state.currentPersonalityKey || '';
                talkCount = state.talkCount || 0;
                careCount = state.careCount || 0;
                if (state.emotionCounts) emotionCounts = state.emotionCounts;
                
                if (state.bgValue !== undefined) {
                    document.getElementById('bgSelect').value = state.bgValue;
                    changeBackground();
                }
            } catch (e) {
                console.error("セーブデータの読み込み失敗:", e);
            }
        }
    }

    function saveApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) {
            localStorage.setItem('geminiApiKey', key);
        }
    }

    function updateDigimonScale() {
        const digimonImg = document.getElementById('digimonImage');
        const actionDigimonImg = document.getElementById('actionDigimonImg');
        const isLarge = ADULT_DIGIMONS.includes(currentForm) || PERFECT_DIGIMONS.includes(currentForm) || ULTIMATE_DIGIMONS.includes(currentForm);

        if (isLarge) {
            digimonImg.classList.add('adult-size');
            actionDigimonImg.classList.add('adult-size');
        } else {
            digimonImg.classList.remove('adult-size');
            actionDigimonImg.classList.remove('adult-size');
        }
    }

    async function checkAvailableModels() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const modelListLog = document.getElementById('modelListLog');
        const errorLog = document.getElementById('errorLog');
        const modelSelectContainer = document.getElementById('modelSelectContainer');
        const modelSelect = document.getElementById('modelSelect');

        modelListLog.style.display = 'none';
        errorLog.style.display = 'none';

        if (!apiKey) {
            alert('APIキーを入力してからボタンを押してください！');
            return;
        }

        saveApiKey();

        modelListLog.innerText = "確認中...";
        modelListLog.style.display = 'block';

        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`エラー (Status: ${response.status})`);
            
            const data = await response.json();
            const availableModels = data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'));
            
            modelSelect.innerHTML = '';
            availableModels.forEach(m => {
                const shortName = m.name.replace('models/', '');
                const option = document.createElement('option');
                option.value = shortName;
                option.text = shortName;
                modelSelect.appendChild(option);
            });

            if(modelSelect.querySelector('option[value="gemini-3.1-flash-lite"]')){
                 modelSelect.value = "gemini-3.1-flash-lite";
            }

            modelListLog.innerText = "【準備OK！】\nプルダウンからモデルを選んで会話を始めてください。";
            modelSelectContainer.style.display = 'block';
            setTimeout(() => { modelListLog.style.display = 'none'; }, 3000);

        } catch (error) {
            modelListLog.style.display = 'none';
            errorLog.innerText = `モデル情報の取得に失敗しました。\n詳細: ${error.message}`;
            errorLog.style.display = 'block';
        }
    }

    function updateCareUI() {
        const counterDisplay = document.getElementById('careCounterDisplay');
        const buttons = [
            document.getElementById('careMeal'),
            document.getElementById('careTrain'),
            document.getElementById('careDefense'),
            document.getElementById('careData')
        ];

        if (careCount >= 5 && !isPerformingAction) {
            counterDisplay.innerText = "お世話OK！";
            counterDisplay.style.color = "#ffcc00";
            buttons.forEach(btn => btn.classList.add('active'));
        } else {
            counterDisplay.innerText = `お世話まで ${careCount}/5`;
            counterDisplay.style.color = "#00ffcc";
            buttons.forEach(btn => btn.classList.remove('active'));
        }
    }

    function executeCare(emotionKey, addAmount, actionGifName, messageText) {
        if (careCount < 5 || isPerformingAction) return;

        isPerformingAction = true;
        emotionCounts[emotionKey] += addAmount;

        document.getElementById('dialogueText').innerHTML = messageText;

        const digimonImage = document.getElementById('digimonImage');
        const actionContainer = document.getElementById('actionContainer');
        const actionDigimonImg = document.getElementById('actionDigimonImg');
        const actionEffectImg = document.getElementById('actionEffectImg');

        updateDigimonScale();
        digimonImage.style.display = 'none';

        const digimonGifName = (currentForm === 'botamon') ? `${emotionKey}.gif` : `${currentForm}_${emotionKey}.gif`;
        actionDigimonImg.src = digimonGifName;
        actionEffectImg.src = actionGifName;

        actionContainer.style.display = 'flex';

        careCount = 0;
        updateCareUI();
        saveData();

        setTimeout(() => {
            actionContainer.style.display = 'none';

            const normalGifName = (currentForm === 'botamon') ? "normal.gif" : `${currentForm}_normal.gif`;
            digimonImage.src = normalGifName;
            digimonImage.style.display = 'block';

            isPerformingAction = false;
            updateCareUI();

            checkEvolutionProgress();
        }, 4000);
    }

    async function sendMessage() {
        if (isPerformingAction) return;

        const apiKey = document.getElementById('apiKey').value.trim();
        const userInput = document.getElementById('userInput').value.trim();
        const dialogueText = document.getElementById('dialogueText');
        const digimonImage = document.getElementById('digimonImage');
        const errorLog = document.getElementById('errorLog');
        const modelSelect = document.getElementById('modelSelect');

        errorLog.style.display = 'none';
        errorLog.innerText = '';

        if (!apiKey) {
            alert('最初にGeminiのAPIキーを入力してください！');
            return;
        }
        if (!userInput) return;

        saveApiKey();

        const selectedModel = modelSelect.value || 'gemini-3.1-flash-lite';
        const currentTrainerName = localStorage.getItem('trainerName') || "パートナー";
        const activeInstruction = window.SYSTEM_INSTRUCTION.replace(/{NAME}/g, currentTrainerName);

        dialogueText.innerText = "考え中...";
        document.getElementById('userInput').value = "";
        document.getElementById('userInput').blur();

        const url = `https://generativelanguage.googleapis.com/v1/models/${selectedModel}:generateContent?key=${apiKey}`;

        const requestBody = {
            contents: [{
                parts: [{
                    text: `${activeInstruction}\n\n話しかけているパートナーの名前: "${currentTrainerName}"\nUser: "${userInput}"\nYour Answer:`
                }]
            }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        emotion: { type: "STRING", enum: ["normal", "happy", "angry", "sad"] },
                        text: { type: "STRING" }
                    },
                    required: ["emotion", "text"]
                }
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`API通信エラー (Status: ${response.status})\nメッセージ: ${JSON.stringify(errData)}`);
            }

            const data = await response.json();
            const result = JSON.parse(data.candidates[0].content.parts[0].text.trim());

            const emotion = result.emotion || 'normal';
            let gifFileName = (currentForm === 'botamon') ? `${emotion}.gif` : `${currentForm}_${emotion}.gif`;
            digimonImage.src = gifFileName;

            dialogueText.innerText = result.text;

            talkCount++;
            if (careCount < 5) {
                careCount++;
                updateCareUI();
            }

            if (emotionCounts.hasOwnProperty(emotion)) {
                emotionCounts[emotion]++;
            }

            saveData();
            checkEvolutionProgress();

        } catch (error) {
            dialogueText.innerText = "エラーが発生しました。下のボックスを確認してください。";
            errorLog.innerText = error.message;
            errorLog.style.display = 'block';
        }
    }

    // --- 進化・転生判定ロジック ---
    function checkEvolutionProgress() {
        if (isPerformingAction) return;

        // 1. ボタモン ➔ コロモン
        if (currentForm === 'botamon' && talkCount >= 10) {
            alert("ボタモンしんか～！");

            currentForm = 'koromon';
            document.getElementById('digimonName').innerText = DIGIMON_NAMES[currentForm];
            
            rollRandomPersonality();
            updatePersonalityDisplay();
            updateSystemInstruction();
            updateDigimonScale();

            document.getElementById('digimonImage').src = "koromon_normal.gif";
            document.getElementById('dialogueText').innerText = `ボタモンは コロモン に進化した！（せいかくが「${PERSONALITIES[currentPersonalityKey].name}」になったよ！）`;
            
            talkCount = 0;
            emotionCounts = { happy: 0, angry: 0, sad: 0, normal: 0 };
            saveData();
        }
        // 2. コロモン ➔ 成長期（アグモン各種）分岐
        else if (currentForm === 'koromon' && talkCount >= 20) {
            checkChildBranch();
        }
        // 3. 成長期 ➔ 成熟期分岐
        else if (['agumon', 'agumon2006', 'agumon_black', 'yuki_agumon'].includes(currentForm) && talkCount >= 30) {
            checkAdultBranch();
        }

        }

        const dialogueText = document.getElementById('dialogueText');
        let maxCount = -1;

        ['happy', 'angry', 'sad', 'normal'].forEach(emo => {
            const count = emotionCounts[emo];
            if (count > maxCount) {
                maxCount = count;
                dominantEmotions = [emo];
            } else if (count === maxCount && count > 0) {
                dominantEmotions.push(emo);
            }
        });

        let nextForm = '';
        if (dominantEmotions.length !== 1 || maxCount === 0) {
            const candidates = ['agumon', 'agumon2006', 'agumon_black', 'yuki_agumon'];
            nextForm = candidates[Math.floor(Math.random() * candidates.length)];
        } else {
            const winning = dominantEmotions[0];
            if (winning === 'normal') nextForm = 'agumon';
            if (winning === 'happy')  nextForm = 'agumon2006';
            if (winning === 'angry')  nextForm = 'agumon_black';
            if (winning === 'sad')    nextForm = 'yuki_agumon';

        updatePersonalityDisplay();
        updateSystemInstruction();

        emotionCounts = { happy: 0, angry: 0, sad: 0, normal: 0 };

    }
